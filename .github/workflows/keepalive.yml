name: Supabase keep-alive

# Free-tier Supabase projects are paused after ~1 week of inactivity.
# Query the table every 3 days so the project stays active.
# Uses the publishable (anon) key, which is already public in index.html.
on:
  schedule:
    - cron: '0 2 */3 * *'   # 02:00 UTC every 3 days
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query church_speaker_roster
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -H "apikey: sb_publishable_lG8rWGweZ6xinE6b9qrqIQ_pNbz74CH" \
            "https://liqvunlcqlxkvyzggyxe.supabase.co/rest/v1/church_speaker_roster?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
      # Re-enable this workflow each run so GitHub's 60-day inactivity auto-disable
      # does not stop the schedule (best effort; failure must not fail the ping).
      - name: Re-enable this workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
